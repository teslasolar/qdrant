name: Build and Push Backend Docker Image

on:
  push:
    branches: [ claude/automation-gpt-multimodal-search-013LkL58AK8txgYpiizQcrsA, feature/medical-vercel-docker ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/qdrant-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./os/backend
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: 'Optional: Deploy to remote via SSH'
        if: ${{ secrets.SSH_HOST && secrets.SSH_USER && secrets.SSH_PRIVATE_KEY }}
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Logging into GHCR if credentials provided"
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME || github.repository_owner }} --password-stdin
            fi
            docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }} || true
            docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest || true
            docker stop qdrant_backend || true
            docker rm qdrant_backend || true
            docker run -d --name qdrant_backend -p 8000:8000 ${{ env.IMAGE_NAME }}:latest
