<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISA-101 Docking Layout - Medical Imaging SCADA</title>
<style>
/* ISA-101 High Performance HMI - Cream & Purple Theme */
:root {
  /* Cream & Purple Color Palette */
  --color-bg-primary: #2a1a3a;        /* Deep Purple Background */
  --color-bg-secondary: #3d2a52;      /* Medium Purple */
  --color-bg-tertiary: #1a0f26;       /* Darkest Purple */
  --color-cream: #f5f2e8;             /* Primary Cream */
  --color-cream-dark: #e8e0c8;        /* Darker Cream */
  --color-purple-light: #9b7eb8;      /* Light Purple */
  --color-purple-accent: #b794f4;     /* Bright Purple */
  --color-purple-glow: #8b5cf6;       /* Glowing Purple */

  /* ISA-101 Semantic Colors */
  --color-normal: #90ee90;            /* Green - Normal Operation */
  --color-warning: #ffd700;           /* Yellow - Warning */
  --color-alarm: #ff6b6b;             /* Red - Alarm */
  --color-inactive: #808080;          /* Gray - Inactive */
  --color-active: #00bfff;            /* Cyan - Active */

  /* Dock Dimensions */
  --dock-north-height: 80px;
  --dock-south-height: 40px;
  --dock-east-width: 280px;
  --dock-west-width: 280px;

  /* Spacing */
  --dock-gap: 4px;
  --border-width: 2px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--color-bg-primary);
  color: var(--color-cream);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

/* Main Docking Container */
.dock-container {
  display: grid;
  grid-template-areas:
    "north north north"
    "west center east"
    "south south south";
  grid-template-rows: var(--dock-north-height) 1fr var(--dock-south-height);
  grid-template-columns: var(--dock-west-width) 1fr var(--dock-east-width);
  gap: var(--dock-gap);
  height: 100vh;
  width: 100vw;
  padding: var(--dock-gap);
  background: var(--color-bg-tertiary);
}

/* Dock Panels */
.dock-panel {
  background: linear-gradient(135deg, var(--color-bg-secondary), var(--color-bg-primary));
  border: var(--border-width) solid var(--color-purple-light);
  border-radius: 8px;
  padding: 12px;
  overflow: auto;
  box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
  transition: all 0.3s ease;
}

.dock-panel:hover {
  border-color: var(--color-purple-accent);
  box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
}

/* North Dock - Header/Navigation */
.dock-north {
  grid-area: north;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: linear-gradient(135deg, #3d2a52, #2a1a3a);
  border-bottom: 3px solid var(--color-purple-glow);
}

/* South Dock - Footer/Status Bar */
.dock-south {
  grid-area: south;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  font-size: 0.85em;
  background: linear-gradient(135deg, #1a0f26, #2a1a3a);
  border-top: 3px solid var(--color-purple-glow);
}

/* East Dock - Right Sidebar */
.dock-east {
  grid-area: east;
  border-left: 3px solid var(--color-purple-glow);
}

/* West Dock - Left Sidebar */
.dock-west {
  grid-area: west;
  border-right: 3px solid var(--color-purple-glow);
}

/* Center Dock - Main Content */
.dock-center {
  grid-area: center;
  background: var(--color-bg-tertiary);
  border: var(--border-width) solid var(--color-purple-accent);
  box-shadow: inset 0 0 20px rgba(139, 92, 246, 0.2);
}

/* Scrollbar Styling */
.dock-panel::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

.dock-panel::-webkit-scrollbar-track {
  background: var(--color-bg-tertiary);
  border-radius: 4px;
}

.dock-panel::-webkit-scrollbar-thumb {
  background: var(--color-purple-light);
  border-radius: 4px;
}

.dock-panel::-webkit-scrollbar-thumb:hover {
  background: var(--color-purple-accent);
}

/* Header Styling */
.dock-header {
  display: flex;
  align-items: center;
  gap: 20px;
}

.dock-logo {
  font-size: 1.8em;
  font-weight: 700;
  color: var(--color-cream);
  text-shadow: 0 0 15px var(--color-purple-glow);
}

.dock-title {
  font-size: 1.3em;
  color: var(--color-cream-dark);
}

.dock-nav {
  display: flex;
  gap: 15px;
  margin-left: auto;
}

.dock-nav-item {
  padding: 8px 16px;
  background: rgba(245, 242, 232, 0.1);
  border: 1px solid var(--color-cream-dark);
  border-radius: 6px;
  color: var(--color-cream);
  text-decoration: none;
  font-weight: 600;
  transition: all 0.3s;
}

.dock-nav-item:hover {
  background: var(--color-purple-accent);
  border-color: var(--color-purple-glow);
  box-shadow: 0 0 15px rgba(139, 92, 246, 0.6);
  color: var(--color-cream);
}

/* Status Bar Items */
.status-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 12px;
  background: rgba(245, 242, 232, 0.05);
  border-radius: 4px;
}

.status-indicator {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  animation: pulse 2s infinite;
}

.status-indicator.normal {
  background: var(--color-normal);
  box-shadow: 0 0 10px var(--color-normal);
}

.status-indicator.warning {
  background: var(--color-warning);
  box-shadow: 0 0 10px var(--color-warning);
}

.status-indicator.alarm {
  background: var(--color-alarm);
  box-shadow: 0 0 10px var(--color-alarm);
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* Dock Section Titles */
.dock-section-title {
  font-size: 1.1em;
  font-weight: 700;
  color: var(--color-cream);
  margin-bottom: 15px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--color-purple-light);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* ISA-101 Widget Styling */
.widget {
  background: rgba(245, 242, 232, 0.05);
  border: 1px solid var(--color-purple-light);
  border-radius: 6px;
  padding: 12px;
  margin-bottom: 12px;
  transition: all 0.3s;
}

.widget:hover {
  background: rgba(245, 242, 232, 0.08);
  border-color: var(--color-purple-accent);
}

.widget-title {
  font-weight: 600;
  color: var(--color-cream-dark);
  margin-bottom: 8px;
  font-size: 0.95em;
}

.widget-value {
  font-size: 1.5em;
  font-weight: 700;
  color: var(--color-cream);
  font-family: 'Courier New', monospace;
}

.widget-unit {
  font-size: 0.8em;
  color: var(--color-purple-light);
  margin-left: 5px;
}

/* Loading State */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100px;
  color: var(--color-purple-light);
}

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid var(--color-purple-light);
  border-top-color: var(--color-purple-glow);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Responsive Adjustments */
@media (max-width: 1200px) {
  :root {
    --dock-east-width: 240px;
    --dock-west-width: 240px;
  }
}

@media (max-width: 768px) {
  .dock-container {
    grid-template-areas:
      "north"
      "center"
      "south";
    grid-template-rows: var(--dock-north-height) 1fr var(--dock-south-height);
    grid-template-columns: 1fr;
  }

  .dock-east,
  .dock-west {
    display: none;
  }
}
</style>
</head>
<body>

<div class="dock-container">
  <!-- North Dock - Header -->
  <div class="dock-panel dock-north" id="dock-north">
    <div class="loading">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- West Dock - Left Sidebar -->
  <div class="dock-panel dock-west" id="dock-west">
    <div class="loading">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Center Dock - Main Content -->
  <div class="dock-panel dock-center" id="dock-center">
    <div class="loading">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- East Dock - Right Sidebar -->
  <div class="dock-panel dock-east" id="dock-east">
    <div class="loading">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- South Dock - Status Bar -->
  <div class="dock-panel dock-south" id="dock-south">
    <div class="loading">
      <div class="spinner"></div>
    </div>
  </div>
</div>

<script>
// Docking System Loader
class DockingSystem {
  constructor() {
    this.basePath = '/templates/docking/docks';
    this.docks = {
      north: 'north.html',
      south: 'south.html',
      east: 'east.html',
      west: 'west.html',
      center: 'center.html'
    };
  }

  async loadDock(dockName, containerId) {
    try {
      const response = await fetch(`${this.basePath}/${this.docks[dockName]}`);
      if (!response.ok) throw new Error(`Failed to load ${dockName} dock`);

      const html = await response.text();
      document.getElementById(containerId).innerHTML = html;

      // Trigger custom event for dock loaded
      document.dispatchEvent(new CustomEvent('dock-loaded', {
        detail: { dock: dockName }
      }));

    } catch (error) {
      console.error(`Error loading ${dockName} dock:`, error);
      document.getElementById(containerId).innerHTML = `
        <div style="color: var(--color-alarm); text-align: center;">
          ⚠️ Error loading ${dockName} dock
        </div>
      `;
    }
  }

  async loadAll() {
    await Promise.all([
      this.loadDock('north', 'dock-north'),
      this.loadDock('south', 'dock-south'),
      this.loadDock('east', 'dock-east'),
      this.loadDock('west', 'dock-west'),
      this.loadDock('center', 'dock-center')
    ]);

    console.log('All docks loaded successfully');
  }

  // Allow loading custom dock content
  async loadCustomDock(dockName, url, containerId) {
    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`Failed to load custom dock from ${url}`);

      const html = await response.text();
      document.getElementById(containerId).innerHTML = html;

    } catch (error) {
      console.error(`Error loading custom dock:`, error);
    }
  }
}

// Initialize on page load
const dockingSystem = new DockingSystem();

document.addEventListener('DOMContentLoaded', () => {
  dockingSystem.loadAll();
});

// Listen for dock loaded events
document.addEventListener('dock-loaded', (event) => {
  console.log(`Dock loaded: ${event.detail.dock}`);
});

// Expose globally for external scripts
window.dockingSystem = dockingSystem;
</script>

</body>
</html>
