<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
    color: #e0e0e0;
    min-height: 100vh;
  }

  .loader {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    flex-direction: column;
    gap: 20px;
  }

  .spinner {
    width: 50px;
    height: 50px;
    border: 5px solid #333;
    border-top-color: #00ff88;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 60px 40px;
  }

  header {
    text-align: center;
    margin-bottom: 60px;
  }

  .icon {
    font-size: 4em;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 3em;
    margin-bottom: 15px;
    text-shadow: 0 0 30px rgba(0, 255, 136, 0.4);
  }

  .description {
    color: #888;
    font-size: 1.3em;
  }

  .badge {
    display: inline-block;
    padding: 8px 16px;
    background: #2a2a3e;
    border: 2px solid #00ff88;
    border-radius: 20px;
    font-size: 0.9em;
    font-weight: 600;
    color: #00ff88;
    margin: 10px 5px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 30px;
    margin-bottom: 40px;
  }

  .card {
    background: linear-gradient(135deg, #1a1a2e, #2a2a3e);
    border: 2px solid #333;
    border-left: 5px solid #00ff88;
    border-radius: 12px;
    padding: 30px;
    transition: all 0.3s;
  }

  .card:hover {
    border-color: #00ff88;
    box-shadow: 0 10px 40px rgba(0, 255, 136, 0.2);
    transform: translateY(-3px);
  }

  .card-icon {
    font-size: 2.5em;
    margin-bottom: 15px;
  }

  .card h2 {
    color: #00ff88;
    font-size: 1.6em;
    margin-bottom: 15px;
  }

  .card p {
    color: #aaa;
    line-height: 1.6;
  }

  .card a {
    color: #00ccff;
    text-decoration: none;
  }

  .card a:hover {
    text-decoration: underline;
  }

  .section {
    background: #1a1a2e;
    border: 2px solid #333;
    border-radius: 12px;
    padding: 40px;
    margin-bottom: 40px;
  }

  .section h2 {
    color: #00ff88;
    font-size: 2em;
    margin-bottom: 25px;
  }

  .btn {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s;
    margin: 5px;
  }

  .btn-primary {
    background: linear-gradient(135deg, #00ff88, #00cc66);
    color: #000;
  }

  .btn-secondary {
    background: #2a2a3e;
    color: #00ccff;
    border: 2px solid #00ccff;
  }

  .btn:hover {
    transform: translateY(-2px);
  }

  footer {
    text-align: center;
    padding: 30px;
    color: #666;
    border-top: 2px solid #333;
    margin-top: 60px;
  }

  .color-green h1, .color-green .card { border-left-color: #00ff88; }
  .color-blue h1, .color-blue .card { border-left-color: #00ccff; }
  .color-purple h1, .color-purple .card { border-left-color: #ff88ff; }
  .color-orange h1, .color-orange .card { border-left-color: #ffaa00; }
  .color-red h1, .color-red .card { border-left-color: #ff6666; }
  .color-cyan h1, .color-cyan .card { border-left-color: #00ffff; }
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="spinner"></div>
  <p>Loading index data...</p>
</div>

<div class="container" id="content" style="display: none;"></div>

<script>
// Generic Index Loader
// Loads structured index data and renders the page

async function loadIndex() {
  try {
    // Load index tag data
    const response = await fetch('index/tag.json');
    if (!response.ok) {
      throw new Error('Index data not found');
    }

    const tag = await response.json();

    // Apply color scheme
    document.body.className = `color-${tag.Color_Scheme}`;
    document.title = tag.Title;

    // Build page content
    const content = document.getElementById('content');
    content.innerHTML = `
      <header>
        <div class="icon">${tag.Icon}</div>
        <h1>${tag.Title}</h1>
        <p class="description">${tag.Description}</p>
        <div>
          <span class="badge">${tag.ISA_Level.replace('_', '-')}</span>
          <span class="badge">UUID: ${tag.UUID.substring(0, 8)}</span>
        </div>
      </header>

      ${tag.Parent_Path ? `
      <div style="text-align: center; margin-bottom: 40px;">
        <a href="${tag.Parent_Path}" class="btn btn-secondary">← Parent Directory</a>
      </div>
      ` : ''}

      ${tag.Features && tag.Features.length > 0 ? `
      <div class="section">
        <h2>Features</h2>
        <div class="grid">
          ${tag.Features.map(f => `
            <div class="card">
              <div class="card-icon">${f.icon}</div>
              <h2>${f.title}</h2>
              <p>${f.description}</p>
            </div>
          `).join('')}
        </div>
      </div>
      ` : ''}

      ${tag.Child_Directories && tag.Child_Directories.length > 0 ? `
      <div class="section">
        <h2>Subdirectories</h2>
        <div class="grid">
          ${tag.Child_Directories.map(d => `
            <div class="card">
              <div class="card-icon">${d.icon}</div>
              <h2><a href="${d.path}">${d.title}</a></h2>
              <p>${d.description}</p>
            </div>
          `).join('')}
        </div>
      </div>
      ` : ''}

      ${(tag.Has_PLC || tag.Has_HMI || tag.Has_SCADA) ? `
      <div class="section">
        <h2>Control Interfaces</h2>
        <div style="text-align: center;">
          ${tag.Has_SCADA ? `<a href="${tag.SCADA_Path}" class="btn btn-primary">📊 SCADA</a>` : ''}
          ${tag.Has_HMI ? `<a href="${tag.HMI_Path}" class="btn btn-primary">🎛️ HMI</a>` : ''}
          ${tag.Has_PLC ? `<a href="${tag.PLC_Path}" class="btn btn-primary">⚙️ PLC</a>` : ''}
        </div>
      </div>
      ` : ''}

      ${tag.Related_Files && tag.Related_Files.length > 0 ? `
      <div class="section">
        <h2>Documentation</h2>
        <div class="grid">
          ${tag.Related_Files.map(f => `
            <div class="card">
              <h2><a href="${f.path}">${f.name}</a></h2>
              <p>Type: ${f.type}</p>
            </div>
          `).join('')}
        </div>
      </div>
      ` : ''}

      ${tag.Quick_Actions && tag.Quick_Actions.length > 0 ? `
      <div class="section">
        <h2>Quick Actions</h2>
        <div style="text-align: center;">
          ${tag.Quick_Actions.map(a => `
            <a href="${a.path}" class="btn btn-${a.type}">${a.label}</a>
          `).join('')}
        </div>
      </div>
      ` : ''}

      <footer>
        <p>
          <strong>ISA-95 ${tag.ISA_Level.replace('_', '-')}</strong><br>
          ${tag.Directory_Path}
        </p>
      </footer>
    `;

    // Hide loader, show content
    document.getElementById('loader').style.display = 'none';
    content.style.display = 'block';

  } catch (error) {
    console.error('Error loading index:', error);
    document.getElementById('loader').innerHTML = `
      <div class="card" style="max-width: 500px;">
        <h2 style="color: #ff6666;">⚠️ Error Loading Index</h2>
        <p>${error.message}</p>
        <p style="margin-top: 20px;">
          <a href="../" class="btn btn-secondary">← Go Back</a>
        </p>
      </div>
    `;
  }
}

// Load on page ready
document.addEventListener('DOMContentLoaded', loadIndex);
</script>

</body>
</html>
