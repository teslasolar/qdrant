<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
    color: #e0e0e0;
    min-height: 100vh;
  }

  .loader {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    flex-direction: column;
    gap: 20px;
  }

  .spinner {
    width: 50px;
    height: 50px;
    border: 5px solid #333;
    border-top-color: #00ff88;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 40px;
  }

  /* Breadcrumb Navigation */
  .breadcrumb {
    background: #1a1a2e;
    border: 2px solid #333;
    border-radius: 8px;
    padding: 15px 25px;
    margin-bottom: 30px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .breadcrumb a {
    color: #00ccff;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: color 0.3s;
  }

  .breadcrumb a:hover {
    color: #00ff88;
  }

  .breadcrumb-separator {
    color: #666;
    margin: 0 5px;
  }

  .breadcrumb-current {
    color: #00ff88;
    font-weight: 600;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  .icon {
    font-size: 4em;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 3em;
    margin-bottom: 15px;
    text-shadow: 0 0 30px rgba(0, 255, 136, 0.4);
  }

  .description {
    color: #888;
    font-size: 1.3em;
  }

  .badge {
    display: inline-block;
    padding: 8px 16px;
    background: #2a2a3e;
    border: 2px solid #00ff88;
    border-radius: 20px;
    font-size: 0.9em;
    font-weight: 600;
    color: #00ff88;
    margin: 10px 5px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 30px;
    margin-bottom: 40px;
  }

  .card {
    background: linear-gradient(135deg, #1a1a2e, #2a2a3e);
    border: 2px solid #333;
    border-left: 5px solid #00ff88;
    border-radius: 12px;
    padding: 30px;
    transition: all 0.3s;
    position: relative;
  }

  .card:hover {
    border-color: #00ff88;
    box-shadow: 0 10px 40px rgba(0, 255, 136, 0.2);
    transform: translateY(-3px);
  }

  .card-icon {
    font-size: 2.5em;
    margin-bottom: 15px;
  }

  .card h2 {
    color: #00ff88;
    font-size: 1.6em;
    margin-bottom: 15px;
  }

  .card p {
    color: #aaa;
    line-height: 1.6;
  }

  .card a {
    color: #00ccff;
    text-decoration: none;
  }

  .card a:hover {
    text-decoration: underline;
  }

  .card-badge {
    position: absolute;
    top: 15px;
    right: 15px;
    background: #2a2a3e;
    border: 1px solid #00ff88;
    border-radius: 12px;
    padding: 4px 10px;
    font-size: 0.75em;
    color: #00ff88;
  }

  .section {
    background: #1a1a2e;
    border: 2px solid #333;
    border-radius: 12px;
    padding: 40px;
    margin-bottom: 40px;
  }

  .section h2 {
    color: #00ff88;
    font-size: 2em;
    margin-bottom: 25px;
  }

  .btn {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s;
    margin: 5px;
  }

  .btn-primary {
    background: linear-gradient(135deg, #00ff88, #00cc66);
    color: #000;
  }

  .btn-secondary {
    background: #2a2a3e;
    color: #00ccff;
    border: 2px solid #00ccff;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(0, 255, 136, 0.3);
  }

  .page-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 15px;
  }

  .page-item {
    background: #2a2a3e;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 15px;
    transition: all 0.3s;
  }

  .page-item:hover {
    border-color: #00ccff;
    background: #333;
  }

  .page-item a {
    color: #00ccff;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .page-item-icon {
    font-size: 1.5em;
  }

  .page-item-size {
    font-size: 0.8em;
    color: #888;
    margin-top: 5px;
  }

  footer {
    text-align: center;
    padding: 30px;
    color: #666;
    border-top: 2px solid #333;
    margin-top: 60px;
  }

  .color-green h1, .color-green .card { border-left-color: #00ff88; }
  .color-blue h1, .color-blue .card { border-left-color: #00ccff; }
  .color-purple h1, .color-purple .card { border-left-color: #ff88ff; }
  .color-orange h1, .color-orange .card { border-left-color: #ffaa00; }
  .color-red h1, .color-red .card { border-left-color: #ff6666; }
  .color-cyan h1, .color-cyan .card { border-left-color: #00ffff; }

  /* Sidebar Navigation */
  .sidebar {
    position: fixed;
    right: 20px;
    top: 20px;
    background: #1a1a2e;
    border: 2px solid #333;
    border-radius: 12px;
    padding: 20px;
    max-width: 250px;
    max-height: 80vh;
    overflow-y: auto;
    z-index: 1000;
  }

  .sidebar h3 {
    color: #00ff88;
    font-size: 1.2em;
    margin-bottom: 15px;
  }

  .sidebar ul {
    list-style: none;
  }

  .sidebar li {
    margin-bottom: 10px;
  }

  .sidebar a {
    color: #00ccff;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9em;
    transition: color 0.3s;
  }

  .sidebar a:hover {
    color: #00ff88;
  }

  @media (max-width: 1200px) {
    .sidebar {
      display: none;
    }
  }
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="spinner"></div>
  <p>Loading index data...</p>
</div>

<div class="container" id="content" style="display: none;"></div>

<!-- Sidebar Navigation -->
<div class="sidebar" id="sidebar" style="display: none;"></div>

<script>
// Generic Index Loader with Enhanced Navigation
// Loads structured index data and renders with full navigation hierarchy

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

async function loadIndex() {
  try {
    // Load index tag data
    const response = await fetch('index/tag.json');
    if (!response.ok) {
      throw new Error('Index data not found');
    }

    const tag = await response.json();

    // Apply color scheme
    document.body.className = `color-${tag.Color_Scheme}`;
    document.title = tag.Title;

    // Build breadcrumb navigation
    let breadcrumbHTML = '';
    if (tag.Breadcrumb_Trail && tag.Breadcrumb_Trail.length > 0) {
      breadcrumbHTML = '<div class="breadcrumb">';
      tag.Breadcrumb_Trail.forEach((crumb, index) => {
        if (index > 0) {
          breadcrumbHTML += '<span class="breadcrumb-separator">›</span>';
        }
        if (index === tag.Breadcrumb_Trail.length - 1) {
          breadcrumbHTML += `<span class="breadcrumb-current">${crumb.icon} ${crumb.title}</span>`;
        } else {
          breadcrumbHTML += `<a href="${crumb.path}">${crumb.icon} ${crumb.title}</a>`;
        }
      });
      breadcrumbHTML += '</div>';
    }

    // Build sidebar navigation
    let sidebarHTML = '';
    if (tag.Child_Directories && tag.Child_Directories.length > 0) {
      sidebarHTML += '<h3>📂 Quick Nav</h3><ul>';
      tag.Child_Directories.forEach(dir => {
        sidebarHTML += `<li><a href="${dir.path}">${dir.icon} ${dir.title}</a></li>`;
      });
      sidebarHTML += '</ul>';
    }

    if (tag.Sibling_Directories && tag.Sibling_Directories.length > 0) {
      sidebarHTML += '<h3 style="margin-top: 20px;">🔗 Related</h3><ul>';
      tag.Sibling_Directories.slice(0, 8).forEach(dir => {
        sidebarHTML += `<li><a href="${dir.path}">${dir.icon} ${dir.title}</a></li>`;
      });
      sidebarHTML += '</ul>';
    }

    if (sidebarHTML) {
      document.getElementById('sidebar').innerHTML = sidebarHTML;
      document.getElementById('sidebar').style.display = 'block';
    }

    // Build main content
    const content = document.getElementById('content');
    content.innerHTML = `
      ${breadcrumbHTML}

      <header>
        <div class="icon">${tag.Icon}</div>
        <h1>${tag.Title}</h1>
        <p class="description">${tag.Description}</p>
        <div>
          <span class="badge">${tag.ISA_Level.replace('_', '-')}</span>
          <span class="badge">UUID: ${tag.UUID.substring(0, 8)}</span>
        </div>
      </header>

      ${tag.Page_Links && tag.Page_Links.length > 0 ? `
      <div class="section">
        <h2>📄 Pages in This Directory</h2>
        <div class="page-list">
          ${tag.Page_Links.map(page => `
            <div class="page-item">
              <a href="${page.path}">
                <span class="page-item-icon">${page.icon}</span>
                <div>
                  <div>${page.name}</div>
                  <div class="page-item-size">${formatSize(page.size)}</div>
                </div>
              </a>
            </div>
          `).join('')}
        </div>
      </div>
      ` : ''}

      ${tag.Features && tag.Features.length > 0 ? `
      <div class="section">
        <h2>✨ Features</h2>
        <div class="grid">
          ${tag.Features.map(f => `
            <div class="card">
              <div class="card-icon">${f.icon}</div>
              <h2>${f.title}</h2>
              <p>${f.description}</p>
            </div>
          `).join('')}
        </div>
      </div>
      ` : ''}

      ${tag.Child_Directories && tag.Child_Directories.length > 0 ? `
      <div class="section">
        <h2>📂 Subdirectories</h2>
        <div class="grid">
          ${tag.Child_Directories.map(d => `
            <div class="card">
              ${d.page_count ? `<span class="card-badge">${d.page_count} pages</span>` : ''}
              <div class="card-icon">${d.icon}</div>
              <h2><a href="${d.path}">${d.title}</a></h2>
              <p>${d.description}</p>
            </div>
          `).join('')}
        </div>
      </div>
      ` : ''}

      ${tag.Sibling_Directories && tag.Sibling_Directories.length > 0 ? `
      <div class="section">
        <h2>🔗 Related Directories</h2>
        <div class="grid">
          ${tag.Sibling_Directories.slice(0, 6).map(d => `
            <div class="card">
              <div class="card-icon">${d.icon}</div>
              <h2><a href="${d.path}">${d.title}</a></h2>
              <p>${d.description}</p>
            </div>
          `).join('')}
        </div>
      </div>
      ` : ''}

      ${(tag.has_plc || tag.has_hmi || tag.has_scada) ? `
      <div class="section">
        <h2>🎛️ Control Interfaces</h2>
        <div style="text-align: center;">
          ${tag.has_scada ? `<a href="${tag.scada_path}" class="btn btn-primary">📊 SCADA</a>` : ''}
          ${tag.has_hmi ? `<a href="${tag.hmi_path}" class="btn btn-primary">🎛️ HMI</a>` : ''}
          ${tag.has_plc ? `<a href="${tag.plc_path}" class="btn btn-primary">⚙️ PLC</a>` : ''}
        </div>
      </div>
      ` : ''}

      ${tag.Related_Files && tag.Related_Files.length > 0 ? `
      <div class="section">
        <h2>📚 Documentation</h2>
        <div class="grid">
          ${tag.Related_Files.map(f => `
            <div class="card">
              <h2><a href="${f.path}">${f.name}</a></h2>
              <p>Type: ${f.type}</p>
            </div>
          `).join('')}
        </div>
      </div>
      ` : ''}

      ${tag.Quick_Actions && tag.Quick_Actions.length > 0 ? `
      <div class="section">
        <h2>⚡ Quick Actions</h2>
        <div style="text-align: center;">
          ${tag.Quick_Actions.map(a => `
            <a href="${a.path}" class="btn btn-${a.type}">${a.label}</a>
          `).join('')}
        </div>
      </div>
      ` : ''}

      <footer>
        <p>
          <strong>ISA-95 ${tag.ISA_Level.replace('_', '-')}</strong><br>
          ${tag.Directory_Path}
        </p>
      </footer>
    `;

    // Hide loader, show content
    document.getElementById('loader').style.display = 'none';
    content.style.display = 'block';

  } catch (error) {
    console.error('Error loading index:', error);
    document.getElementById('loader').innerHTML = `
      <div class="card" style="max-width: 500px;">
        <h2 style="color: #ff6666;">⚠️ Error Loading Index</h2>
        <p>${error.message}</p>
        <p style="margin-top: 20px;">
          <a href="../" class="btn btn-secondary">← Go Back</a>
        </p>
      </div>
    `;
  }
}

// Load on page ready
document.addEventListener('DOMContentLoaded', loadIndex);
</script>

</body>
</html>
